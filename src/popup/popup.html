<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude Token Counter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon"></div>
        <h1>Claude Counter <span class="version">v0.5.0</span></h1>
      </div>
    </div>
    
    <div class="content">
      <p class="desc">Real-time token counting, caching timers, and usage tracking for Claude.</p>
      
      <div class="card">
        <div class="setting">
          <div class="setting-info">
            <span class="setting-title">Enable Counter</span>
            <span class="setting-desc">Show overlay on claude.ai</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="status-box" id="statusBox">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Checking status...</span>
      </div>
    </div>

    <div class="footer">
      <a href="https://github.com/amanji0/Claude-token-counter" target="_blank" class="github-link">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
        GitHub Repository
      </a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
